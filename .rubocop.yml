inherit_gem:
  gc_ruboconfig: rubocop.yml

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable

RSpec/NestedGroups:
  Exclude:
    - spec/business/calendar_spec.rb

# Disabled as API uses set_holidays etc
Naming/AccessorMethodName:
  Enabled: false

Gemspec/RequiredRubyVersion:
  Enabled: false

RSpec/IndexedLet:
  Enabled: false
